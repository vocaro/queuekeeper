[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queuekeeper-apple"
version = "1.2.0"
requires-python = ">=3.14"
dependencies = ["queuekeeper>=1.1,<2", "queuekeeper-mac-desktop>=1.1,<2", "queuekeeper-mobile>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["queuekeeper_apple*"]

[tool.setuptools.package-data]
queuekeeper_apple = ["_native/*", "_shims/*"]
