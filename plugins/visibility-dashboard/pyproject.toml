[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queuekeeper-visibility-dashboard"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["queuekeeper==0.1.0"]

[project.entry-points."queuekeeper.visibility"]
dashboard = "queuekeeper_dashboard"

[tool.setuptools.packages.find]
where = ["src"]
include = ["queuekeeper_dashboard*"]

[tool.setuptools.package-data]
queuekeeper_dashboard = ["static/*", "panels/*.js"]
