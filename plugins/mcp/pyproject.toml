[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queuekeeper-mcp"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = ["queuekeeper==1.0.0"]

[project.scripts]
queuekeeper-mcp = "queuekeeper_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["queuekeeper_mcp*"]
