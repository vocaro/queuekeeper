[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queuekeeper-mac-desktop"
version = "1.1.0"
requires-python = ">=3.14"
dependencies = ["queuekeeper>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["queuekeeper_mac_desktop*"]
