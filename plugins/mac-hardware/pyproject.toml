[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queuekeeper-mac-hardware"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["queuekeeper==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["queuekeeper_mac_hardware*"]
