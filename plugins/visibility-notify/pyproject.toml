[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queuekeeper-visibility-notify"
version = "1.1.0"
requires-python = ">=3.14"
dependencies = ["queuekeeper==1.1.0"]

[project.entry-points."queuekeeper.visibility"]
notify = "queuekeeper_notify"

[tool.setuptools.packages.find]
where = ["src"]
include = ["queuekeeper_notify*"]
