[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queuekeeper-unity"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = ["queuekeeper==1.0.0", "queuekeeper-mac-desktop==1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["queuekeeper_unity*"]
