<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t d">
  <title id="t">Queuekeeper logo</title>
  <desc id="d">A stone crypt arch with an open doorway that glows faintly green. A commit line enters grey on the left and leaves green on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0e15"/>
      <stop offset="1" stop-color="#1d2536"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6379"/>
      <stop offset="1" stop-color="#2b3142"/>
    </linearGradient>
    <linearGradient id="doorGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7dea8a" stop-opacity="0.6"/>
      <stop offset="0.7" stop-color="#7dea8a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7dea8a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- commit line: in grey, out green -->
  <path d="M24 196h60" stroke="#8b93a7" stroke-width="6" stroke-linecap="round"/>
  <path d="M172 196h60" stroke="#7dea8a" stroke-width="6" stroke-linecap="round"/>

  <!-- crypt arch -->
  <path d="M64 208V112a64 64 0 0 1 128 0v96z" fill="url(#stone)" stroke="#161a26" stroke-width="4"/>
  <path d="M64 208h128" stroke="#6a748c" stroke-width="8" stroke-linecap="round"/>

  <!-- open doorway -->
  <path d="M100 204v-72a28 28 0 0 1 56 0v72z" fill="#090c12"/>
  <path d="M100 204v-72a28 28 0 0 1 56 0v72z" fill="url(#doorGlow)"/>
  <path d="M93 204v-72a35 35 0 0 1 70 0v72" fill="none" stroke="#7b859c" stroke-width="6"/>

  <!-- commits -->
  <circle cx="40" cy="196" r="12" fill="#141926" stroke="#8b93a7" stroke-width="6"/>
  <circle cx="216" cy="196" r="13" fill="#7dea8a"/>
  <path d="M209.500 196.500l4.500 4.500 8.500-9" fill="none" stroke="#0e2a17" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
