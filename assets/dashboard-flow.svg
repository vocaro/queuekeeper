a:focus { outline: none; }
.cell { fill: none; stroke: var(--muted); stroke-dasharray: 2 2; }
.cell.held { fill: var(--accent); stroke: none; }
.edge { fill: none; stroke: var(--line); stroke-width: 1.75; }
