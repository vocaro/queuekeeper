.p11 { color: var(--p11); }
.p12 { color: var(--p12); }
.agent[class*=" p"], .moving[class*=" p"] { fill: currentColor; }
.edge.submit.live[class*=" p"] { stroke: currentColor; }
@media (prefers-reduced-motion: reduce) { .moving { display: none; } }
