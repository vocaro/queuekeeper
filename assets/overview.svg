<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How Queuekeeper fits together</title>
  <desc id="d">You direct several AI agents, each in its own worktree. The agents send commits to Queuekeeper and get verdicts back. Queuekeeper holds the merge queue, admission and placement, and four plugins: Apple, Unity, Mac desktop and Mac hardware. It builds and tests on your build farm, which is your Mac, another Mac, their simulators and Unity editors, and an iPhone and iPad. It pushes what passed to main in each of your projects, three of them here, on your Git remotes.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0e15"/>
      <stop offset="1" stop-color="#1a2130"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b93a7"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7dea8a"/>
    </marker>
  </defs>

  <rect width="1280" height="660" rx="18" fill="url(#sky)"/>

  <g transform="translate(0 90)">
  <!-- you -->
  <rect x="36" y="215" width="112" height="60" rx="30" fill="#232a3b" stroke="#6a748c" stroke-width="2"/>
  <text x="92" y="252" text-anchor="middle" font-size="21" font-weight="600" fill="#ece8da">You</text>
  <path d="M148 245H224" stroke="#8b93a7" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="186" y="230" text-anchor="middle" font-size="15" fill="#aab1c2">directs</text>

  <!-- agents -->
  <rect x="230" y="90" width="220" height="310" rx="14" fill="#121722" stroke="#3a4256" stroke-width="2"/>
  <text x="340" y="124" text-anchor="middle" font-size="19" font-weight="600" fill="#ece8da">AI agents</text>
  <g fill="#232a3b" stroke="#4a5266" stroke-width="1.5">
    <rect x="252" y="146" width="176" height="62" rx="8"/>
    <rect x="252" y="226" width="176" height="62" rx="8"/>
    <rect x="252" y="306" width="176" height="62" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="340" y="173" font-size="17" font-weight="600" fill="#ece8da">Agent</text>
    <text x="340" y="194" font-size="14" fill="#aab1c2">in its own worktree</text>
    <text x="340" y="253" font-size="17" font-weight="600" fill="#ece8da">Agent</text>
    <text x="340" y="274" font-size="14" fill="#aab1c2">in its own worktree</text>
    <text x="340" y="333" font-size="17" font-weight="600" fill="#ece8da">Agent</text>
    <text x="340" y="354" font-size="14" fill="#aab1c2">in its own worktree</text>
  </g>

  <!-- agents and queuekeeper -->
  <path d="M450 220H554" stroke="#8b93a7" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="502" y="206" text-anchor="middle" font-size="15" fill="#aab1c2">commits</text>
  <path d="M560 272H456" stroke="#8b93a7" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="505" y="296" text-anchor="middle" font-size="15" fill="#aab1c2">verdicts</text>

  </g>

  <!-- queuekeeper -->
  <rect x="560" y="50" width="290" height="570" rx="14" fill="#121722" stroke="#7dea8a" stroke-width="2"/>
  <text x="705" y="86" text-anchor="middle" font-size="21" font-weight="700" fill="#7dea8a">Queuekeeper</text>
  <g fill="#232a3b" stroke="#4a5266" stroke-width="1.5">
    <rect x="582" y="108" width="246" height="78" rx="8"/>
    <rect x="582" y="204" width="246" height="78" rx="8"/>
    <rect x="582" y="300" width="246" height="298" rx="8"/>
  </g>
  <g fill="#1a2130" stroke="#4a5266" stroke-width="1.5">
    <rect x="598" y="372" width="214" height="46" rx="6"/>
    <rect x="598" y="426" width="214" height="46" rx="6"/>
    <rect x="598" y="480" width="214" height="46" rx="6"/>
    <rect x="598" y="534" width="214" height="46" rx="6"/>
  </g>
  <g text-anchor="middle">
    <text x="705" y="143" font-size="18" font-weight="600" fill="#ece8da">Merge queue</text>
    <text x="705" y="166" font-size="14" fill="#aab1c2">batches, tests, bisects</text>
    <text x="705" y="239" font-size="17" font-weight="600" fill="#ece8da">Admission and placement</text>
    <text x="705" y="262" font-size="14" fill="#aab1c2">picks a machine with room</text>
    <text x="705" y="332" font-size="18" font-weight="600" fill="#ece8da">Plugins</text>
    <text x="705" y="354" font-size="14" fill="#aab1c2">each knows a platform</text>
    <text x="705" y="391" font-size="15" font-weight="600" fill="#ece8da">Apple</text>
    <text x="705" y="408" font-size="12.5" fill="#aab1c2">simulators, devices, Xcode</text>
    <text x="705" y="445" font-size="15" font-weight="600" fill="#ece8da">Unity</text>
    <text x="705" y="462" font-size="12.5" fill="#aab1c2">an unattended editor</text>
    <text x="705" y="499" font-size="15" font-weight="600" fill="#ece8da">Mac desktop</text>
    <text x="705" y="516" font-size="12.5" fill="#aab1c2">dialogs and permissions</text>
    <text x="705" y="553" font-size="15" font-weight="600" fill="#ece8da">Mac hardware</text>
    <text x="705" y="570" font-size="12.5" fill="#aab1c2">lanes kept on their chip</text>
  </g>

  <!-- queuekeeper and the build farm -->
  <path d="M856 190H984" stroke="#8b93a7" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="920" y="175" text-anchor="middle" font-size="15" fill="#aab1c2">builds and tests</text>

  <!-- build farm -->
  <rect x="990" y="40" width="254" height="300" rx="14" fill="#121722" stroke="#3a4256" stroke-width="2"/>
  <text x="1117" y="74" text-anchor="middle" font-size="19" font-weight="600" fill="#ece8da">Your build farm</text>
  <path d="M1117 234V258" stroke="#6a748c" stroke-width="2"/>
  <g fill="#232a3b" stroke="#4a5266" stroke-width="1.5">
    <rect x="1010" y="92" width="214" height="62" rx="8"/>
    <rect x="1010" y="172" width="214" height="62" rx="8"/>
    <rect x="1010" y="258" width="214" height="56" rx="28"/>
  </g>
  <g text-anchor="middle">
    <text x="1117" y="119" font-size="17" font-weight="600" fill="#ece8da">Your Mac</text>
    <text x="1117" y="140" font-size="14" fill="#aab1c2">simulators · Unity editor</text>
    <text x="1117" y="199" font-size="17" font-weight="600" fill="#ece8da">Another Mac</text>
    <text x="1117" y="220" font-size="14" fill="#aab1c2">simulators · Unity editor</text>
    <text x="1117" y="292" font-size="17" font-weight="600" fill="#ece8da">iPhone and iPad</text>
  </g>

  <!-- repositories -->
  <rect x="990" y="372" width="254" height="248" rx="14" fill="#121722" stroke="#3a4256" stroke-width="2"/>
  <text x="1117" y="404" text-anchor="middle" font-size="19" font-weight="600" fill="#ece8da">Your Git remotes</text>
  <text x="921" y="434" text-anchor="middle" font-size="12.5" fill="#7dea8a">pushes what passed</text>
  <path d="M856 448H1016" stroke="#7dea8a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M1022 428v36a95 9 0 0 0 190 0v-36" fill="#232a3b" stroke="#7dea8a" stroke-width="2"/>
  <ellipse cx="1117" cy="428" rx="95" ry="9" fill="#2b3447" stroke="#7dea8a" stroke-width="2"/>
  <text x="1117" y="460" text-anchor="middle" font-size="13" fill="#aab1c2"><tspan font-size="16" font-weight="700" fill="#ece8da">main</tspan> of one project</text>
  <path d="M856 510H1016" stroke="#7dea8a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M1022 490v36a95 9 0 0 0 190 0v-36" fill="#232a3b" stroke="#7dea8a" stroke-width="2"/>
  <ellipse cx="1117" cy="490" rx="95" ry="9" fill="#2b3447" stroke="#7dea8a" stroke-width="2"/>
  <text x="1117" y="522" text-anchor="middle" font-size="13" fill="#aab1c2"><tspan font-size="16" font-weight="700" fill="#ece8da">main</tspan> of another project</text>
  <path d="M856 572H1016" stroke="#7dea8a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M1022 552v36a95 9 0 0 0 190 0v-36" fill="#232a3b" stroke="#7dea8a" stroke-width="2"/>
  <ellipse cx="1117" cy="552" rx="95" ry="9" fill="#2b3447" stroke="#7dea8a" stroke-width="2"/>
  <text x="1117" y="584" text-anchor="middle" font-size="13" fill="#aab1c2"><tspan font-size="16" font-weight="700" fill="#ece8da">main</tspan> of a third project</text>
</svg>
