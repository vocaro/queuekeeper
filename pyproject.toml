[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queuekeeper"
version = "0.1.0"
description = "A merge queue and build farm for one developer's agents, on that developer's own Macs"
license = {file = "LICENSE"}
requires-python = ">=3.14"
dependencies = []

[project.scripts]
qk = "queuekeeper.cli:main"

[tool.setuptools.packages.find]
where = ["src/python"]

[tool.setuptools.package-data]
queuekeeper = ["visibility/dashboard/static/*", "visibility/dashboard/panels/*.js"]
