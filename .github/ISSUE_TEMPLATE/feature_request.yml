name: Feature request
description: Something Queuekeeper should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where Queuekeeper gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
